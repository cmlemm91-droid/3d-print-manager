<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Drucker - 3D Print Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <nav class="bg-blue-600 text-white p-4 rounded-lg shadow-lg mb-8 flex justify-between items-center">
            <a href="/" class="text-xl font-bold">🖨️ PrintManager</a>
            <div class="flex gap-6">
                <a href="/" class="hover:underline">Dashboard</a>
                <a href="/orders" class="hover:underline">Aufträge</a>
                <a href="/inventory" class="hover:underline">Lager</a>
                <a href="/customers" class="hover:underline">Kunden</a>
                <a href="/printers" class="hover:underline font-bold">Drucker</a>
            </div>
        </nav>

        <div class="bg-white p-6 rounded shadow mb-8 border-t-4 border-orange-500">
            <h2 class="text-xl font-semibold mb-4">🖨️ Neuen Drucker anlegen</h2>
            <form action="/add_printer" method="post" class="flex flex-col gap-4 md:flex-row">
                <input name="name" placeholder="Drucker Name (z.B. Ender 3)" class="border p-2 rounded flex-1" required>
                <input name="cost_per_hour" type="number" step="0.01" placeholder="Kosten pro Std (€)" class="border p-2 rounded w-full md:w-48" required>
                <button type="submit" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600 font-bold">Hinzufügen</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-4">Liste der Drucker</h2>
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50">
                    <tr class="border-b">
                        <th class="p-2">ID</th><th>Name</th><th>Kosten/Std</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in printers %}
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2">{{ p.id }}</td><td>{{ p.name }}</td>
                        <td class="font-semibold">{{ p.cost_per_hour }} €</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
