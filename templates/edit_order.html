<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Auftrag bearbeiten</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-xl mx-auto">
        <div class="bg-white p-6 rounded shadow">
            <h1 class="text-2xl font-bold mb-6 text-blue-600">📝 Auftrag #{{ order.id }} bearbeiten</h1>
            <form action="/update_order/{{ order.id }}" method="post" class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Modell-Name</label>
                    <input name="model" value="{{ order.model }}" class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Material</label>
                    <select name="material_id" class="w-full border p-2 rounded">
                        {% for item in inventory %}
                        <option value="{{ item.id }}" {% if item.id == order.material_id %}selected{% endif %}>
                            {{ item.material }} ({{ item.color }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Drucker</label>
                    <select name="printer_id" class="w-full border p-2 rounded">
                        {% for p in printers %}
                        <option value="{{ p.id }}" {% if p.id == order.printer_id %}selected{% endif %}>
                            {{ p.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Verbrauch in Gramm</label>
                    <input name="weight_used" type="number" step="0.1" value="{{ order.weight_used }}" class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Druckzeit (Std)</label>
                    <input name="duration_hours" type="number" step="0.1" value="{{ order.duration_hours }}" class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">CAD-Zeit (Std)</label>
                    <input name="cad_hours" type="number" step="0.1" value="{{ order.cad_hours }}" class="w-full border p-2 rounded" required>
                </div>
                <div class="flex gap-4 mt-4">
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 flex-1 font-bold">Speichern & Preis aktualisieren</button>
                    <a href="/orders" class="bg-gray-300 text-gray-700 px-4 py-2 roundedt-center">Abbrechen</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html >
